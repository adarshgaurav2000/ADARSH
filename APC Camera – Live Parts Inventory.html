<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APC Camera – Live Parts Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--panel2:#f5f7f9;--line:#d5dbe1;--tx:#12171d;--mut:#5d6873;--acc:#d6001c;--ok:#0a8f4e;--warn:#b7791f;--bad:#d6001c;--imgbg:#fff;--shadow:0 6px 24px rgba(20,30,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e12;--panel:#141a21;--panel2:#1a222b;--line:#26313c;--tx:#e8edf2;--mut:#8b98a5;--acc:#ff2e44;--ok:#2ee38b;--warn:#ffb020;--bad:#ff4d5e;--imgbg:#e9edf1;--shadow:0 8px 28px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0b0e12;--panel:#141a21;--panel2:#1a222b;--line:#26313c;--tx:#e8edf2;--mut:#8b98a5;--acc:#ff2e44;--ok:#2ee38b;--warn:#ffb020;--bad:#ff4d5e;--imgbg:#e9edf1;--shadow:0 8px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box}html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(128,140,150,.05) 6px 7px)}
h1,h2,h3,.num,.tab,.chip,.tag{font-family:Rajdhani,Inter,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--acc);padding-bottom:14px}
h1{margin:0;font-size:30px;letter-spacing:.06em;text-transform:uppercase}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:Rajdhani;font-size:34px;line-height:1}.kpi small{color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.ok b{color:var(--ok)}.warn b{color:var(--warn)}.bad b{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tab,.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px;font-weight:600;letter-spacing:.04em}
.tab.on,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.units{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--mut)}
.units label{display:flex;gap:6px;align-items:center}.units input{width:58px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.im{height:150px;background:var(--imgbg);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}.im img{max-width:100%;max-height:100%;object-fit:contain}
.tag{position:absolute;top:8px;left:8px;font-size:12px;padding:2px 9px;border-radius:5px;color:#fff;letter-spacing:.08em;text-transform:uppercase}
.t-common{background:#4b5b6b}.t-roof{background:#1f6fd1}.t-side{background:#12935a}
.st{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;color:#fff}
.s-AVAILABLE{background:var(--ok);color:#06210f}.s-PARTIAL{background:var(--warn);color:#2a1a00}.s-MISSING{background:var(--bad)}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.cb h3{margin:0;font-size:18px;line-height:1.15}.pn{color:var(--mut);font-size:12px;font-family:ui-monospace,monospace}
.meter{height:7px;background:var(--panel2);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .4s}
.rq{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.rq b{color:var(--tx)}
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.loc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center}.loc small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.loc div{display:flex;align-items:center;justify-content:center;gap:4px}.loc b{font-family:Rajdhani;font-size:20px;min-width:24px}
.loc button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1;padding:0}.loc button:hover{background:var(--acc);color:#fff}
.rm{color:var(--mut);font-size:12px;min-height:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-family:Rajdhani;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row input,.row select,dialog input,dialog select,dialog textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.log li{padding:7px 0;border-bottom:1px solid var(--line);list-style:none}.log{margin:0;padding:0}.log small{color:var(--mut)}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--acc);border-radius:14px;max-width:520px;width:calc(100% - 24px);padding:16px}dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}dialog input,dialog select,dialog textarea{width:100%}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9}
.big{height:200px;background:var(--imgbg);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}.big img{max-width:100%;max-height:100%}
.scroll{overflow-x:auto}
</style></head><body><div class="wrap">
<header><div><h1>APC Camera <span>Parts Control</span></h1><div class="sub">Roof &amp; Side mounted · Inventory · Testing</div></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="live"><i></i><span id="who">connecting…</span></span><button class="btn" id="theme">Theme</button><button class="btn pri" id="addp">+ Add part</button></div></header>
<div class="kpis" id="kpis"></div>
<div class="bar"><button class="tab on" data-t="parts">Parts</button><button class="tab" data-t="sets">Testing sets</button><button class="tab" data-t="log">Activity</button></div>
<div id="main"></div></div>
<dialog id="dlg"></dialog><div id="toast"></div>

  m.innerHTML=`<div class="bar">${fs.map(([k,n])=>`<button class="chip ${S.f===k?'on':''}" data-f="${k}">${n}</button>`).join('')}<input class="search" id="q" placeholder="Search part name or number…" value="${esc(S.q)}"></div>
  <div class="units">Number of APC units planned:<label>Common <input type="number" min="0" data-u="common" value="${S.units.common}"></label><label>Roof <input type="number" min="0" data-u="roof" value="${S.units.roof}"></label><label>Side <input type="number" min="0" data-u="side" value="${S.units.side}"></label><span>Need = qty per APC × units</span></div>
  <div class="grid">${a.map(card).join('')||'<div class="panel">No parts match.</div>'}</div>`;
  const q=$('#q');q.oninput=()=>{S.q=q.value.toLowerCase();const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
 else if(S.tab==='sets'){m.innerHTML=`<div class="panel"><div class="row"><input id="sn" placeholder="Set no (e.g. SET-01)"><select id="sv"><option>Roof</option><option>Side</option></select><input id="st" placeholder="Given to (name / dept)"><button class="btn pri" id="sadd">Add set</button></div>
  <div class="scroll"><table><tr><th>Set</th><th>Type</th><th>Given to</th><th>Date</th><th>Status</th><th></th></tr>${S.sets.map(s=>`<tr><td><b>${esc(s.no)}</b></td><td>${esc(s.variant)}</td><td>${esc(s.to)}</td><td>${new Date(s.at).toLocaleDateString()}</td><td><select data-ss="${s.id}">${['With Testing','Passed','Failed','Returned to Store'].map(o=>`<option ${o===s.status?'selected':''}>${o}</option>`).join('')}</select></td><td><button class="btn" data-sd="${s.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6">No sets logged yet.</td></tr>'}</table></div></div>`}
 else m.innerHTML=`<div class="panel"><ul class="log">${S.log.map(l=>`<li>${esc(l.text)}<br><small>${esc(nm(l.by))} · ${new Date(l.at).toLocaleString()}</small></li>`).join('')||'<li>No changes yet.</li>'}</ul></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-s],[data-f],[data-t],[data-o],[data-sd]');if(!t)return;
 if(t.dataset.s){const[a,b,c]=t.dataset.s.split('|');step(a,b,+c)}
 else if(t.dataset.f){S.f=t.dataset.f;render()}else if(t.dataset.t){S.tab=t.dataset.t;render()}
 else if(t.dataset.o)open(t.dataset.o);else if(t.dataset.sd)S.db.doc('sets/'+t.dataset.sd).delete().catch(fail)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.u){const u={...S.units,[t.dataset.u]:Math.max(0,+t.value||0)};S.units=u;render();S.db&&S.db.doc('config/units').set(u).catch(fail)}
 if(t.dataset.ss)S.db.doc('sets/'+t.dataset.ss).update({status:t.value}).then(()=>logit('Set status → '+t.value)).catch(fail)});
document.addEventListener('click',e=>{if(e.target.id==='sadd'){const no=$('#sn').value.trim();if(!no)return toast('Enter a set number');
 S.db.collection('sets').add({no,variant:$('#sv').value,to:$('#st').value.trim(),status:'With Testing',at:Date.now(),by:S.me}).then(()=>logit('New test set '+no)).catch(fail)}});
function open(id){const p=all().find(x=>x.id===id),e=eff(p),d=$('#dlg');
 d.innerHTML=`<div class="big">${p.img?`<img src="${IMG[p.img]}" alt="">`:''}</div><h2 style="margin:6px 0 0">${esc(p.name)}</h2><div class="pn">${esc(p.no)} · ${GN[p.g]} · ${esc(p.cat)}</div>
 <label>Store</label><input id="d1" type="number" min="0" value="${+e.store||0}"><label>With testing</label><input id="d2" type="number" min="0" value="${+e.testing||0}"><label>In cabin</label><input id="d3" type="number" min="0" value="${+e.cabin||0}"><label>Remark</label><textarea id="d4" rows="2">${esc(e.remark||'')}</textarea>
 <div class="row" style="margin:14px 0 0;justify-content:flex-end">${p.custom?'<button class="btn" id="ddel">Delete part</button>':''}<button class="btn" id="dc">Close</button><button class="btn pri" id="ds">Save</button></div>`;
 d.showModal();$('#dc').onclick=()=>d.close();
 $('#ds').onclick=()=>{save(p,{store:+$('#d1').value||0,testing:+$('#d2').value||0,cabin:+$('#d3').value||0,remark:$('#d4').value},`${p.name}: stock updated`);d.close()};
 if(p.custom)$('#ddel').onclick=()=>{S.db.doc('custom/'+p.id).delete().then(()=>logit('Deleted part '+p.name)).catch(fail);d.close()}}
$('#addp').onclick=()=>{const d=$('#dlg');d.innerHTML=`<h2 style="margin:0">Add new part</h2><label>Part name</label><input id="n1"><label>Part no</label><input id="n2"><label>Used in</label><select id="n3"><option value="common">Common (both)</option><option value="roof">Roof only</option><option value="side">Side only</option></select><label>Category</label><input id="n4" placeholder="e.g. Enclosure"><label>Qty per APC</label><input id="n5" type="number" min="1" value="1">
 <div class="row" style="margin:14px 0 0;justify-content:flex-end"><button class="btn" id="dc">Cancel</button><button class="btn pri" id="ds">Add</button></div>`;d.showModal();$('#dc').onclick=()=>d.close();
 $('#ds').onclick=()=>{const n=$('#n1').value.trim();if(!n)return toast('Enter a part name');const id='c'+Date.now().toString(36);
  S.db.doc('custom/'+id).set({name:n,no:$('#n2').value.trim()||'TBD',g:$('#n3').value,cat:$('#n4').value.trim()||'Other',qpa:+$('#n5').value||1,s0:0,custom:true,by:S.me,at:Date.now()}).then(()=>logit('Added part '+n)).catch(fail);d.close()}};
$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};
(async()=>{render();
 try{const u=await claude.use('user');if(u){S.me=await u.id();const me=await u.me();S.names[S.me]=me.name;$('#who').textContent='Live · '+(me.name||'signed in')}}catch(e){}
 const db=await claude.use('db');if(!db){$('#who').textContent='Read-only (sign in to Claude to edit)';return}
 S.db=db;if(!S.me)$('#who').textContent='Live · shared';
 const ER=e=>{};
 db.collection('stock').onSnapshot(s=>{S.stock={};s.docs.forEach(d=>S.stock[d.id]=d.data());render();resolve(s.docs.map(d=>d.data().by))},ER);
 db.collection('custom').onSnapshot(s=>{S.custom=s.docs.map(d=>({id:d.id,...d.data()}));render()},ER);
 db.collection('sets').onSnapshot(s=>{S.sets=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);render()},ER);
 db.collection('log').orderBy('at','desc').limit(40).onSnapshot(s=>{S.log=s.docs.map(d=>d.data());render();resolve(S.log.map(l=>l.by))},ER);
 db.doc('config/units').onSnapshot(d=>{if(d.exists){S.units={...S.units,...d.data()};render()}},ER)})();
</script></body></html>
